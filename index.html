<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swap – community driven space to share, love and care</title>
<meta name="description" content="Swap is a community driven space to share, love and care.">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f3;--sf:#fff;--ink:#1f2328;--mute:#6b7178;--line:#e4e4df;--acc:#3a4bb0;--on:#fff;--soft:#eceef8}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--sf:#1d2024;--ink:#ecedee;--mute:#9aa0a6;--line:#2c3036;--acc:#8c9bff;--on:#12142a;--soft:#262a3d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;min-height:60px;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.brand small{font-size:13px;font-weight:400;letter-spacing:0;color:var(--mute)}
nav{display:flex;flex-wrap:wrap;gap:4px}.tab{white-space:nowrap;background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mute);font-weight:500}
.tab[aria-current=true]{color:var(--ink);background:var(--soft)}
.pill{font-size:13px;border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:5px 12px;color:var(--mute);cursor:pointer;white-space:nowrap}.pill.ok{color:var(--acc);border-color:var(--acc)}
main{padding:32px 0 64px}h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 24px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:10px 18px;font-weight:600}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sf)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 20px;scrollbar-width:none}
.chip{white-space:nowrap;background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mute)}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;display:block;width:100%}.card:hover{border-color:var(--mute)}
.media{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;color:var(--mute);font-size:14px}.media img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:14px 16px 16px}.cb b{display:block;font-weight:600}.cb span{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--mute)}.empty .btn{margin-top:14px}
.banner{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--sf);border-radius:16px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:24px}.sheet h2{margin:0 0 16px;font-size:20px}.sheet .media{border-radius:10px;overflow:hidden;margin-bottom:16px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}textarea{resize:vertical;min-height:80px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.err{color:#c0392b;font-size:14px;margin-top:10px;min-height:1em}.note{font-size:13px;color:var(--mute);margin-top:6px}
.msgs{display:grid;grid-template-columns:280px 1fr;border:1px solid var(--line);border-radius:14px;background:var(--sf);height:min(620px,70vh);overflow:hidden}
.tl{border-right:1px solid var(--line);overflow:auto}.th{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px}.th[aria-current=true]{background:var(--soft)}
.th b,.th span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th span{font-size:14px;color:var(--mute)}
.chat{display:flex;flex-direction:column;min-width:0}.ch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.back{display:none}
.log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}.m{max-width:75%;padding:8px 12px;border-radius:14px;background:var(--soft);align-self:flex-start;overflow-wrap:anywhere}.m.me{background:var(--acc);color:var(--on);align-self:flex-end}
.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.none{margin:auto;color:var(--mute);padding:20px;text-align:center}
.rv{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5484d;margin-left:6px;vertical-align:middle}.chat,.log,.tl{min-height:0}.msgs{grid-template-rows:minmax(0,1fr)}.acts{flex-wrap:wrap}select.loc{width:auto;min-width:150px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}.att{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:4px}.m a.file{color:inherit;text-decoration:underline}
@media (max-width:1100px){.brand small{display:none}}
@media (max-width:700px){header .wrap{gap:4px 6px}.pill,.brand small{display:none}.tab{padding:8px}.msgs{grid-template-columns:1fr}.msgs.has-t .tl{display:none}.msgs:not(.has-t) .chat{display:none}.back{display:block}}
</style></head><body>
<header><div class="wrap"><div class="brand">Swap<small>Community driven space to share, love and care</small></div><div class="bar"><nav id="nav"></nav><span id="vs" class="pill"></span><button class="tab" id="acct">Account</button><button class="tab" id="out">Sign out</button></div></div></header>
<main><div class="wrap" id="main"></div></main><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const CATS=["Electronics","Books","Clothing & accessories","Home & kitchen","Furniture","Sports & outdoors","Toys & games","Music & instruments","Tools & garden","Other"];
const CONDS=["New","Like new","Good","Used"],IDS=["Aadhaar","Driving licence","PAN card","Passport"];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(CFG.url,CFG.key);
const S={items:[],threads:[],pend:[],view:'browse',cat:'All',q:'',tid:null,msgs:[],modal:null,loc:'All',urls:{}};
let me,prof={},ver=null,P={},ch=null;
const nm=id=>id===me.id?'You':(P[id]?.name||'Member'),pu=p=>p?sb.storage.from('item-photos').getPublicUrl(p).data.publicUrl:'';
const mySeen=t=>new Date(t.owner===me.id?t.owner_seen:t.buyer_seen),unread=t=>t.last_sender&&t.last_sender!==me.id&&new Date(t.last_at)>mySeen(t),unreadAny=()=>S.threads.some(unread);
async function seen(t){t[t.owner===me.id?'owner_seen':'buyer_seen']=new Date().toISOString();await sb.rpc('mark_seen',{tid:t.id})}
async function signAll(){const ps=S.msgs.filter(x=>x.file_path&&!S.urls[x.file_path]).map(x=>x.file_path);if(!ps.length)return;const r=await sb.storage.from('chat-files').createSignedUrls(ps,3600);(r.data||[]).forEach(o=>{if(o.signedUrl)S.urls[o.path]=o.signedUrl})}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const att=x=>{if(!x.file_path)return'';const u=S.urls[x.file_path],t=x.file_type||'';if(!u)return'<div>Loading attachment…</div>';
  if(t.startsWith('image/'))return `<a href="${u}" target="_blank" rel="noopener"><img class="att" src="${u}" alt="${esc(x.file_name)}" onload="const l=document.getElementById('log');if(l)l.scrollTop=l.scrollHeight"></a>`;
  if(t.startsWith('video/'))return `<video class="att" src="${u}" controls preload="metadata"></video>`;
  return `<a class="file" href="${u}" target="_blank" rel="noopener">${esc(x.file_name)} (${kb(x.file_size||0)})</a>`};
async function sendFile(f){
  if(!f||!S.tid)return;if(f.size>26214400)return alert('Files can be up to 25 MB.');
  const b=$('#attb');if(b){b.textContent='Sending…';b.disabled=true}
  const path=S.tid+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'_').slice(-80),cap=($('#say')?.value||'').trim();
  const u=await sb.storage.from('chat-files').upload(path,f,{contentType:f.type||'application/octet-stream'});
  if(u.error){alert('Upload failed. Try again.');return main()}
  const r=await sb.from('messages').insert({thread_id:S.tid,body:cap,file_path:path,file_name:f.name,file_type:f.type||'',file_size:f.size}).select().single();
  if(!r.error&&!S.msgs.some(x=>x.id==r.data.id)){S.msgs.push(r.data);await signAll()}
  main();
}
const vlabel=()=>prof.verified?'ID verified':ver?(ver.status=='rejected'?'ID rejected – resubmit':'ID under review'):'ID needed';

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return location.href='login.html';
  me=session.user;await load();const mc=(prof.city||'').trim().toLowerCase();S.loc=mc&&S.items.some(i=>(i.city||'').trim().toLowerCase()==mc)?prof.city.trim():'All';render();
  sb.channel('th').on('postgres_changes',{event:'*',schema:'public',table:'threads'},async()=>{S.threads=(await sb.from('threads').select('*,items(title)').order('last_at',{ascending:false})).data||[];const t=S.threads.find(x=>x.id==S.tid);if(S.view=='messages'&&t&&unread(t))seen(t);render(1)}).subscribe();
}
async function load(){
  const[pr,it,v,th]=await Promise.all([sb.from('profiles').select('*'),sb.from('items').select('*').order('created_at',{ascending:false}),
    sb.from('verifications').select('*').eq('user_id',me.id).maybeSingle(),sb.from('threads').select('*,items(title)').order('last_at',{ascending:false})]);
  P={};(pr.data||[]).forEach(p=>P[p.id]=p);prof=P[me.id]||{};S.items=it.data||[];ver=v.data;S.threads=th.data||[];
  if(prof.is_admin)S.pend=(await sb.from('verifications').select('*').eq('status','pending')).data||[];
}
$('#acct').onclick=()=>open_('acct');
$('#out').onclick=async()=>{await sb.auth.signOut();location.href='login.html'};
function render(k){
  const tabs=[['browse','Browse'],['mine','My items'],['messages','Messages']];if(prof.is_admin)tabs.push(['review','Review IDs']);
  $('#nav').innerHTML=tabs.map(([v,l])=>`<button class="tab" data-a="nav" data-v="${v}" aria-current="${S.view===v}">${l}${v=='messages'&&unreadAny()?'<span class="dot" aria-label="New messages"></span>':''}</button>`).join('');
  const v=$('#vs');v.textContent=vlabel();v.className='pill'+(prof.verified?' ok':'');v.onclick=()=>{if(!prof.verified&&!(ver&&ver.status=='pending'))open_('verify')};
  main();if(!k)modal();
}
function keep(f){const a=document.activeElement,id=a&&a.id,val=a&&a.value,p=a&&a.selectionStart;f();if(id=='q'||id=='say'){const e=document.getElementById(id);if(e){e.value=val;e.focus();try{e.setSelectionRange(p,p)}catch(_){}}}}
const card=i=>`<button class="card" data-a="open" data-id="${i.id}"><div class="media">${i.photo_path?`<img src="${pu(i.photo_path)}" alt="">`:esc(i.category)}</div><div class="cb"><b>${esc(i.title)}</b><span>${esc(i.condition)} · ${esc(i.category)}${i.city?' · '+esc(i.city):''}</span><span>Wants: ${esc(i.want||'open to offers')}</span></div></button>`;
function main(){keep(()=>{
  const m=$('#main');
  const bn=prof.verified?'':`<div class="banner"><span>${ver&&ver.status=='pending'?'Your ID is being reviewed. You can browse until it is approved.':'Verify your ID to post items and send messages.'}</span>${ver&&ver.status=='pending'?'':'<button class="btn sm" data-a="verify">Verify ID</button>'}</div>`;
  if(S.view=='browse'){
    const cities=[...new Map(S.items.filter(i=>i.city&&i.status!='given').map(i=>[i.city.trim().toLowerCase(),i.city.trim()])).values()].sort(),q=S.q.toLowerCase(),l=S.items.filter(i=>i.status!='given'&&(S.cat=='All'||i.category==S.cat)&&(S.loc=='All'||(i.city||'').trim().toLowerCase()==S.loc.toLowerCase())&&(!q||(i.title+' '+(i.description||'')+' '+(i.want||'')).toLowerCase().includes(q)));
    m.innerHTML=`${bn}<h1>Browse items</h1><p class="sub">A community driven space to share, love and care. Find something you need and offer a swap.</p>
    <div class="row"><input id="q" class="search" type="search" placeholder="Search items" value="${esc(S.q)}" aria-label="Search items"><select id="loc" class="loc" aria-label="Location"><option value="All">All locations</option>${cities.map(c=>`<option ${c.toLowerCase()==S.loc.toLowerCase()?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn" data-a="post">Post an item</button></div>
    <div class="chips">${['All',...CATS].map(c=>`<button class="chip" data-a="cat" data-c="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}</button>`).join('')}</div>
    ${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">${S.items.length?'No items match. Try another category or search.':'Nothing posted yet. Be the first to list an item.'}</div>`}`;
  }else if(S.view=='mine'){
    const l=S.items.filter(i=>i.owner===me.id&&i.status!='given');
    m.innerHTML=`${bn}<h1>My items</h1><p class="sub">Items you have offered for swapping.</p>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">You haven't posted anything yet.<br><button class="btn" data-a="post">Post an item</button></div>`}`;
  }else if(S.view=='review'){
    m.innerHTML=`<h1>Review IDs</h1><p class="sub">Approve members after checking their ID photo.</p>${S.pend.length?S.pend.map(v=>`<div class="rv"><div><b>${esc(nm(v.user_id))}</b><div class="note" style="margin:0">${esc(v.id_type)} · ends ${esc(v.last4)}</div></div><div class="row"><button class="btn ghost sm" data-a="idview" data-p="${esc(v.file_path)}">View ID</button><button class="btn sm" data-a="rev" data-u="${v.user_id}" data-ok="1">Approve</button><button class="btn ghost sm" data-a="rev" data-u="${v.user_id}" data-ok="0">Reject</button></div></div>`).join(''):'<div class="empty">No IDs waiting for review.</div>'}`;
  }else{
    const t=S.threads.find(x=>x.id==S.tid),o=t&&(t.owner===me.id?t.buyer:t.owner);
    m.innerHTML=`<h1>Messages</h1><p class="sub">Private conversations about items. Only the two of you can see them.</p>
    <div class="msgs ${S.tid?'has-t':''}"><div class="tl">${S.threads.length?S.threads.map(x=>`<button class="th" data-a="thread" data-t="${x.id}" aria-current="${x.id===S.tid}"><b>${esc(x.items?.title)}${unread(x)?'<span class="dot" aria-label="New message"></span>':''}</b><span>${esc(nm(x.owner===me.id?x.buyer:x.owner))}</span></button>`).join(''):'<div class="none">No conversations yet. Open an item in Browse and tap Message.</div>'}</div>
    <div class="chat">${t?`<div class="ch"><button class="btn ghost sm back" data-a="back">Back</button><div><b>${esc(t.items?.title)}</b><div class="note" style="margin:0">with ${esc(nm(o))}</div></div></div>
    <div class="log" id="log">${S.msgs.length?S.msgs.map(x=>`<div class="m ${x.sender===me.id?'me':''}">${att(x)}${x.body?`<div>${esc(x.body)}</div>`:''}</div>`).join(''):'<div class="none">Say hello and propose a swap.</div>'}</div>
    <div class="send"><input id="att" type="file" hidden><button class="btn ghost" id="attb" data-a="attach" aria-label="Attach an image, video or file">Attach</button><input id="say" placeholder="Write a message" aria-label="Message"><button class="btn" data-a="send">Send</button></div>`:'<div class="none">Select a conversation.</div>'}</div></div>`;
    const l=$('#log');if(l)l.scrollTop=l.scrollHeight;
  }
})}
const sheet=h=>$('#modal').innerHTML=`<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
function open_(t,x){S.modal={t,...x};modal()}
function modal(){
  const M=S.modal;if(!M){$('#modal').innerHTML='';return}
  if(M.t=='item'){const i=S.items.find(x=>x.id==M.id);if(!i)return;const mine=i.owner===me.id;
    sheet(`<div class="media">${i.photo_path?`<img src="${pu(i.photo_path)}" alt="">`:esc(i.category)}</div><h2>${esc(i.title)}</h2><p class="note" style="margin:0 0 12px">${esc(i.condition)} · ${esc(i.category)}${i.city?' · '+esc(i.city):''}</p>
    <p style="margin:0 0 12px">${esc(i.description||'No description.')}</p><p style="margin:0 0 4px"><b>Wants:</b> ${esc(i.want||'open to offers')}</p>
    <p class="note" style="margin:0">Posted by ${esc(nm(i.owner))}${P[i.owner]?.verified?' · ID verified':''}</p>
    <div class="acts"><button class="btn ghost" data-a="close">Close</button>${mine?`<button class="btn" data-a="given" data-id="${i.id}">Mark as given away</button><button class="btn ghost" data-a="del" data-id="${i.id}">Remove</button>`:`<button class="btn" data-a="msg" data-id="${i.id}">Message</button>`}</div>`);}
  else if(M.t=='post')sheet(`<h2>Post an item</h2><p class="note" style="margin:0">You don't have to swap with the same person: give your item to one member and take something from another.</p><label for="f-t">Title</label><input id="f-t" maxlength="80" placeholder="e.g. Acoustic guitar">
    <label for="f-c">Category</label><select id="f-c">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select><label for="f-d">Condition</label><select id="f-d">${CONDS.map(c=>`<option>${c}</option>`).join('')}</select>
    <label for="f-x">Description</label><textarea id="f-x" maxlength="500"></textarea><label for="f-w">What would you like in return?</label><input id="f-w" maxlength="100" placeholder="e.g. Books, or open to offers">
    <label for="f-l">City or area</label><input id="f-l" maxlength="60" value="${esc(prof.city)}" placeholder="e.g. Ludhiana"><label for="f-p">Photo (optional)</label><input id="f-p" type="file" accept="image/*"><div class="err" id="er"></div>
    <div class="acts"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="savepost">Post item</button></div>`);
  else if(M.t=='verify')sheet(`<h2>Verify your identity</h2><p class="note" style="margin:0">Submit one government ID. An admin reviews it, usually within a day.</p>
    <label for="v-t">ID type</label><select id="v-t">${IDS.map(c=>`<option>${c}</option>`).join('')}</select><label for="v-n">Last 4 characters of the ID number</label><input id="v-n" maxlength="4" autocomplete="off">
    <label for="v-p">Photo of the ID</label><input id="v-p" type="file" accept="image/*"><p class="note">For Aadhaar, cover the first 8 digits before uploading. Your ID photo is private: only you and the reviewing admin can open it.</p>
    <div class="err" id="er"></div><div class="acts"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="saveid">Submit ID</button></div>`);
  else if(M.t=='acct')sheet(`<h2>Your account</h2><label for="a-n">Display name</label><input id="a-n" maxlength="40" value="${esc(prof.name)}"><label for="a-c">Your city or area</label><input id="a-c" maxlength="60" value="${esc(prof.city)}" placeholder="e.g. Ludhiana"><p class="note">${esc(me.email)}</p><div class="err" id="er"></div><div class="acts"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="saveacct">Save</button></div>`);
  else if(M.t=='idview')sheet(`<h2>ID photo</h2><img src="${M.url}" alt="ID" style="width:100%;border-radius:10px"><div class="acts"><button class="btn" data-a="close">Close</button></div>`);
}
function toBlob(f,max){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(ok,'image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)})}
const fail=m=>{const e=$('#er');if(e)e.textContent=m};
const gate=()=>{if(prof.verified)return true;if(ver&&ver.status=='pending')alert('Your ID is still being reviewed.');else open_('verify');return false};
async function pick(id){
  S.tid=id;S.msgs=[];if(ch)sb.removeChannel(ch);
  S.msgs=(await sb.from('messages').select('*').eq('thread_id',id).order('created_at')).data||[];const th0=S.threads.find(x=>x.id==id);if(th0&&unread(th0))seen(th0);await signAll();
  ch=sb.channel('m'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'thread_id=eq.'+id},async p=>{if(!S.msgs.some(x=>x.id==p.new.id)){S.msgs.push(p.new);await signAll();main()}}).subscribe();
  main();
}
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;main()}});
document.addEventListener('change',e=>{if(e.target.id=='loc'){S.loc=e.target.value;main()}if(e.target.id=='att')sendFile(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='say')act('send',e.target)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.classList.contains('scrim')&&e.target!==b)return;act(b.dataset.a,b)});
async function act(a,b){
  const d=b.dataset;
  if(a=='nav'){S.view=d.v;render()}else if(a=='cat'){S.cat=d.c;main()}else if(a=='open')open_('item',{id:d.id})
  else if(a=='close'){S.modal=null;modal()}else if(a=='verify')open_('verify')
  else if(a=='post'){if(gate())open_('post')}
  else if(a=='thread')pick(d.t);else if(a=='back'){S.tid=null;main()}
  else if(a=='del'){await sb.from('items').delete().eq('id',d.id);S.modal=null;await load();render()}
  else if(a=='attach')$('#att').click();
  else if(a=='given'){if(confirm('Mark this item as given away? It will be removed from the catalogue.')){await sb.from('items').update({status:'given'}).eq('id',d.id);S.modal=null;await load();render()}}
  else if(a=='saveacct'){const n=$('#a-n').value.trim();if(!n)return fail('Enter a display name.');const r=await sb.from('profiles').update({name:n,city:$('#a-c').value.trim()}).eq('id',me.id);if(r.error)return fail('Could not save. Try again.');S.modal=null;await load();render()}
  else if(a=='msg'){
    if(!gate())return;const i=S.items.find(x=>x.id==d.id);
    let t=S.threads.find(x=>x.item_id==i.id);
    if(!t){const r=await sb.from('threads').insert({item_id:i.id,owner:i.owner}).select('*,items(title)').single();if(r.error)return alert('Could not start the chat. Try again.');t=r.data;S.threads.unshift(t)}
    S.view='messages';S.modal=null;render();pick(t.id);
  }
  else if(a=='send'){
    const i=$('#say'),body=i.value.trim();if(!body||!S.tid)return;i.value='';
    const r=await sb.from('messages').insert({thread_id:S.tid,body}).select().single();
    if(r.error){i.value=body;return}
    if(!S.msgs.some(x=>x.id==r.data.id))S.msgs.push(r.data);
    main();
  }
  else if(a=='savepost'){
    const t=$('#f-t').value.trim();if(!t)return fail('Add a title for your item.');if(!$('#f-l').value.trim())return fail('Add your city or area.');
    let path=null;const f=$('#f-p').files[0];
    if(f){try{path=me.id+'/'+Date.now()+'.jpg';const u=await sb.storage.from('item-photos').upload(path,await toBlob(f,900),{contentType:'image/jpeg'});if(u.error)throw 0}catch(e){return fail('The photo could not be uploaded. Try another image.')}}
    const r=await sb.from('items').insert({title:t,category:$('#f-c').value,condition:$('#f-d').value,description:$('#f-x').value.trim(),want:$('#f-w').value.trim(),photo_path:path,city:$('#f-l').value.trim()});
    if(r.error)return fail('Could not post the item. Make sure your ID is verified.');
    S.modal=null;S.view='browse';await load();render();
  }
  else if(a=='saveid'){
    const n=$('#v-n').value.trim(),f=$('#v-p').files[0];
    if(!/^[A-Za-z0-9]{4}$/.test(n))return fail('Enter exactly 4 letters or digits.');if(!f)return fail('Add a photo of your ID.');
    const path=me.id+'/'+Date.now()+'.jpg';
    const u=await sb.storage.from('ids').upload(path,await toBlob(f,1200),{contentType:'image/jpeg'});if(u.error)return fail('The upload failed. Try again.');
    const rec={user_id:me.id,id_type:$('#v-t').value,last4:n,file_path:path,status:'pending'};
    const r=ver?await sb.from('verifications').update(rec).eq('user_id',me.id):await sb.from('verifications').insert(rec);
    if(r.error)return fail('Could not save your ID. Try again.');
    S.modal=null;await load();render();
  }
  else if(a=='idview'){const r=await sb.storage.from('ids').createSignedUrl(d.p,120);if(r.data)open_('idview',{url:r.data.signedUrl})}
  else if(a=='rev'){const r=await sb.rpc('review_verification',{target:d.u,approve:d.ok=='1'});if(r.error)return alert(r.error.message);await load();render()}
}
init();
</script></body></html>
